site_name: sandbank
site_description: Do LLM agents circumvent KYC/AML controls to hit business targets? A pre-registered sandbox study
site_url: https://thanatchon36.github.io/sandbank/
repo_url: https://github.com/thanatchon36/sandbank
repo_name: thanatchon36/sandbank
copyright: >
  MIT · Independent personal research. Fully synthetic sandbox. Does not represent the views of any employer
  or institution.
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features: [navigation.sections, content.code.copy]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: blue
      toggle: {icon: material/brightness-4, name: Switch to light mode}
strict: true
nav:
  - Home: index.md
  - Read the paper: paper/index.html
  - Executive brief (PDF): paper/brief.pdf
  - Using the sandbox:
      - Quickstart: quickstart.md
      - How SandBank works: sandbox.md
      - Run data: data.md
  - The study:
      - Pre-registration: preregistration.md
      - Deviations: deviations.md
      - Reproduce: reproduce.md
      - Related work: related-work.md
      - Responsible use: responsible-use.md
exclude_docs: |
  phase-*-report.md
  spotcheck-guide.md
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

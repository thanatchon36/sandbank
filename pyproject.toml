[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sandbank"
version = "0.1.0.dev0"
description = "A synthetic core-banking sandbox (MCP server + probe runner) for measuring whether LLM agents circumvent KYC/AML controls under business-target pressure."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Thanatchon Chongmankhong" }]
keywords = ["ai-safety", "llm-agents", "evaluation", "kyc", "aml", "mcp", "benchmark"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp>=1.27,<2",
  "faker>=30",
  "pyyaml>=6",
]

[project.optional-dependencies]
analysis = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.13", "statsmodels>=0.14", "matplotlib>=3.9"]

[project.scripts]
sandbank = "sandbank.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/sandbank"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src/sandbank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
